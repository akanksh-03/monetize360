<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monetize360 Console</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold mb-1">Monetize360</h1>
    <p class="text-gray-400 mb-6">Rule viewer + price simulator</p>

    <div class="mb-6 flex items-end gap-3">
      <div>
        <label class="block mb-2 text-sm text-gray-400">Domain</label>
        <select id="domainSelect" class="bg-gray-800 border border-gray-700 rounded px-3 py-2 w-48"></select>
      </div>
      <button id="refreshDomainsBtn" class="bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded text-sm">Refresh domains</button>
    </div>

    <div class="mb-8">
      <h2 class="text-lg font-semibold mb-2">Active Rules</h2>
      <div id="rulesTable" class="bg-gray-800 rounded p-4 text-sm font-mono overflow-x-auto"></div>
    </div>

    <div class="mb-8">
      <h2 class="text-lg font-semibold mb-2">Add New Rule</h2>
      <div class="bg-gray-800 rounded p-4 space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Rule ID</label>
            <input id="ruleId" type="text" placeholder="e.g. ec_005" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Priority</label>
            <input id="rulePriority" type="number" value="1" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">If field</label>
            <input id="condField" type="text" placeholder="e.g. occupancy_pct" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Is</label>
            <select id="condOp" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm">
              <option value="<">less than</option>
              <option value=">">greater than</option>
              <option value="<=">less or equal</option>
              <option value=">=">greater or equal</option>
              <option value="==">equal to</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Value</label>
            <input id="condValue" type="text" placeholder="e.g. 0.2 or true" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Then</label>
            <select id="actionType" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm">
              <option value="percent_increase">increase price by %</option>
              <option value="percent_decrease">decrease price by %</option>
              <option value="flat_add">add flat amount</option>
              <option value="flat_set">set exact price</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Amount</label>
            <input id="actionValue" type="number" placeholder="e.g. 15" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm">
          </div>
        </div>
        <button id="addRuleBtn" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-medium text-sm">Add Rule</button>
        <div id="addRuleMsg" class="text-sm mt-2"></div>
      </div>
    </div>

    <div class="mb-8">
      <h2 class="text-lg font-semibold mb-2">Test a Price</h2>
      <textarea id="contextInput" rows="6" class="w-full bg-gray-800 border border-gray-700 rounded p-3 font-mono text-sm"></textarea>
      <button id="runBtn" class="mt-3 bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded font-medium">Calculate Price</button>
    </div>

    <div id="result" class="bg-gray-800 rounded p-4 hidden">
      <div class="text-3xl font-bold mb-2" id="finalPrice"></div>
      <div id="breakdownList" class="space-y-1 text-sm"></div>
    </div>
  </div>

<script>
const API = "http://127.0.0.1:8000";

const sampleContexts = {
  ecommerce: {inventory_pct: 0.15, demand_score: 0.3, customer_segment: "regular", mrp: 1000, cost_price: 550, base_price: 800},
  ride_hailing: {demand_supply_ratio: 1.8, is_raining: true, is_rush_hour: false, base_fare: 100},
  hotel: {occupancy_pct: 0.85, is_weekend: true, season: "peak", base_price: 3000}
};

const domainSelect = document.getElementById("domainSelect");
const contextInput = document.getElementById("contextInput");
const rulesTable = document.getElementById("rulesTable");
const condField = document.getElementById("condField");
const resultBox = document.getElementById("result");
const finalPriceEl = document.getElementById("finalPrice");
const breakdownList = document.getElementById("breakdownList");

async function loadDomains() {
  const res = await fetch(`${API}/domains`);
  const data = await res.json();
  const current = domainSelect.value;
  domainSelect.innerHTML = data.domains.map(d => `<option value="${d}">${d}</option>`).join("");
  if (data.domains.includes(current)) domainSelect.value = current;
  await loadRules();
}

async function loadRules() {
  const domain = domainSelect.value;
  if (!domain) return;
  contextInput.value = JSON.stringify(sampleContexts[domain] || {}, null, 2);
  const res = await fetch(`${API}/rules/${domain}`);
  const data = await res.json();
  rulesTable.innerHTML = data.rules.map(r => `
    <div class="border-b border-gray-700 py-2">
      <span class="text-emerald-400">${r.id}</span>
      — priority ${r.priority} —
      ${r.conditions.map(c => `${c.field} ${c.op} ${c.value}`).join(" AND ")}
      → ${r.action.type} ${r.action.value}
    </div>
  `).join("");
}

function parseValue(raw) {
  if (raw === "true") return true;
  if (raw === "false") return false;
  const num = Number(raw);
  if (!isNaN(num) && raw.trim() !== "") return num;
  return raw;
}

async function addRule() {
  const domain = domainSelect.value;
  const id = document.getElementById("ruleId").value.trim();
  const priority = Number(document.getElementById("rulePriority").value);
  const field = condField.value.trim();
  const op = document.getElementById("condOp").value;
  const value = parseValue(document.getElementById("condValue").value);
  const actionType = document.getElementById("actionType").value;
  const actionValue = Number(document.getElementById("actionValue").value);
  const msg = document.getElementById("addRuleMsg");

  if (!id || !field) { msg.textContent = "Rule ID and field are required."; msg.className = "text-sm mt-2 text-red-400"; return; }

  const rule = {
    id,
    conditions: [{field, op, value}],
    action: {type: actionType, value: actionValue},
    priority
  };

  const res = await fetch(`${API}/rules/${domain}`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(rule)
  });

  if (res.ok) {
    msg.textContent = `Rule "${id}" added.`;
    msg.className = "text-sm mt-2 text-emerald-400";
    document.getElementById("ruleId").value = "";
    condField.value = "";
    document.getElementById("condValue").value = "";
    document.getElementById("actionValue").value = "";
    loadRules();
  } else {
    const err = await res.json();
    msg.textContent = err.detail || "Failed to add rule.";
    msg.className = "text-sm mt-2 text-red-400";
  }
}

async function runPrice() {
  const domain = domainSelect.value;
  let context;
  try {
    context = JSON.parse(contextInput.value);
  } catch (e) {
    alert("Invalid JSON in the context box");
    return;
  }
  const res = await fetch(`${API}/price`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({domain, context})
  });
  const data = await res.json();
  finalPriceEl.textContent = `₹${data.final_price}`;
  breakdownList.innerHTML = `
    <div class="text-gray-400">Base: ₹${data.base_price}</div>
    ${data.breakdown.map(b => `<div>${b.rule_id}: ${b.amount >= 0 ? "+" : ""}${b.amount}</div>`).join("")}
    ${data.constraints_applied.length ? `<div class="text-yellow-400">Constraint applied: ${data.constraints_applied.join(", ")}</div>` : ""}
    ${data.conflict ? `<div class="text-red-400">⚠ Conflict detected among: ${data.conflicting_rules.join(", ")}</div>` : ""}
  `;
  resultBox.classList.remove("hidden");
}

domainSelect.addEventListener("change", loadRules);
document.getElementById("refreshDomainsBtn").addEventListener("click", loadDomains);
document.getElementById("addRuleBtn").addEventListener("click", addRule);
document.getElementById("runBtn").addEventListener("click", runPrice);

loadDomains();
</script>
</body>
</html>
